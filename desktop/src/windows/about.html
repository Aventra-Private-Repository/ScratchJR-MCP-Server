<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>About</title>
<link rel="stylesheet" href="dialog.css">
<style>
  .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .version { font-size: 12.5px; color: var(--ink-faint); margin: 4px 0 0; }
  .credits { list-style: none; margin: 0; padding: 0; }
  .credits li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .credits li:last-child { border-bottom: 0; }
  .credits .name { font-weight: 600; font-size: 13.5px; }
  .credits .role { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 4px; }
  .credits a { font-size: 12px; word-break: break-all; }
  .section { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 4px; }
  .legal { font-size: 12px; color: var(--ink-faint); line-height: 1.6; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header class="head">
  <h1 class="wordmark" id="wordmark">Scratch.JR [ AI-Assisted ]</h1>
  <p class="version" id="version">v1.0.2</p>
</header>

<main class="body">
  <p class="section">Credits</p>
  <ul class="credits" id="credits"></ul>

  <p class="legal" id="legal"></p>
</main>

<footer class="foot">
  <span class="spacer"></span>
  <button type="button" class="primary" id="close">Close</button>
</footer>

<script src="about-window.js"></script>
</body>
</html>
